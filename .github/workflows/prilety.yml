name: Přílety PRG – záloha každých 5 minut
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: prilety
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stáhnout tabuli
        run: python3 fetch_prilety.py prilety.json
      - name: Vložit snímek do index.html
        run: python3 build.py
      - name: Uložit a vynutit nové nasazení webu
        run: |
          git config user.name "prilety-bot"
          git config user.email "bot@users.noreply.github.com"
          git add prilety.json index.html
          if git diff --cached --quiet; then
            echo "beze změny"
          else
            git commit -m "přílety $(date -u +%Y-%m-%dT%H:%M)Z"
            git push
            curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          fi
